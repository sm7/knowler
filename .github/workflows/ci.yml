name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
          cd engine
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd engine
          pytest tests/ -v --tb=short

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          cd engine
          pip install -e ".[dev]"

      - name: mypy
        run: |
          cd engine
          mypy knowler_engine/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: |
          cd engine
          ruff check knowler_engine/

  frontend:
    name: Frontend build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          cd app
          npm ci

      - name: Type check
        run: |
          cd app
          npx tsc --noEmit

      - name: Test
        run: |
          cd app
          npm test

      - name: Build
        run: |
          cd app
          npm run build
