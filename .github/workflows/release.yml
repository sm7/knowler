name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # to create GitHub Release
  id-token: write   # for PyPI trusted publishing (OIDC)

jobs:
  # ─── 1. Run tests ────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine deps
        run: |
          cd engine
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd engine
          pytest tests/ -v

  # ─── 2. Build frontend + wheel ──────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build React frontend
        run: |
          cd app
          npm ci
          npm run build

      - name: Copy frontend into Python package
        run: |
          rm -rf engine/knowler_engine/static
          cp -r app/dist engine/knowler_engine/static

      - name: Build wheel and sdist
        run: |
          cd engine
          pip install build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: engine/dist/

  # ─── 3. Publish to PyPI ─────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/knowler
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC trusted publishing — no API token needed.
        # Configure trusted publisher at https://pypi.org/manage/account/publishing/

  # ─── 4. Create GitHub Release ───────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
