[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowler"
version = "0.1.0"
description = "Local-first AI knowledge compiler — turn bookmarks, PDFs, and articles into a structured wiki"
readme = "../README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Knowler Contributors" },
]
keywords = [
    "knowledge-management",
    "ai",
    "llm",
    "rag",
    "research",
    "obsidian",
    "local-first",
    "pkm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    # Web server
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    # IPC / async
    "anyio>=4.3",
    # HTTP / web fetching
    "httpx>=0.27",
    "trafilatura>=1.12",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # PDF
    "pypdf>=4.0",
    # Image metadata
    "Pillow>=10.0",
    # Data / validation
    "pydantic>=2.7",
    # Database
    "aiosqlite>=0.20",
    # YAML
    "pyyaml>=6.0",
    # Templating
    "jinja2>=3.1",
    # LLM providers
    "anthropic>=0.28",
    "openai>=1.30",
    # Keychain
    "keyring>=25.0",
    # Structured output helpers
    "jsonschema>=4.22",
    # Logging
    "structlog>=24.1",
    # Date handling
    "python-dateutil>=2.9",
    # Checksums / IDs (python-ulid provides the ULID() constructor API used throughout)
    "python-ulid>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
    "types-beautifulsoup4",
    "types-python-dateutil",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/sm7/knowler"
Repository = "https://github.com/sm7/knowler"
Documentation = "https://github.com/sm7/knowler#readme"
"Bug Tracker" = "https://github.com/sm7/knowler/issues"
Changelog = "https://github.com/sm7/knowler/releases"

[project.scripts]
knowler = "knowler_engine.__main__:main"
knowler-engine = "knowler_engine.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["knowler_engine"]
artifacts = ["knowler_engine/static/**"]

[tool.hatch.build.targets.sdist]
include = [
    "knowler_engine/**",
    "migrations/**",
    "prompts/**",
    "../README.md",
    "../LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
